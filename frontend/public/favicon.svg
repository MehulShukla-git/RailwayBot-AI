  <line x1="6" y1="39" x2="42" y2="39" stroke="url(#g2)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- AI circuit nodes -->
  <circle cx="10" cy="11" r="2" fill="#22d3ee" opacity="0.8"/>
