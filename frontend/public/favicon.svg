  <line x1="20" y1="9" x2="30" y2="11" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="11" x2="40" y2="9" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
