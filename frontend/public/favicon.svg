  </defs>
  <rect width="48" height="48" rx="12" fill="url(#g1)"/>
  <!-- Train body -->
  <rect x="8" y="18" width="26" height="14" rx="4" fill="white" opacity="0.95"/>
  <rect x="30" y="20" width="10" height="10" rx="5" fill="white" opacity="0.95"/>
  <!-- Window -->
